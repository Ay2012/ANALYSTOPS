name: Agent production evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: agent-production-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Require live-model credentials
        run: test -n "$OPENAI_API_KEY"
      - name: Generate balanced evaluation corpus
        run: >-
          python -m analystops.datasets.manifests
          --max-files 40
          --scenario currency_strings
          --scenario date_format_changes
          --scenario duplicate_rows
          --scenario incomplete_file
          --scenario renamed_columns
          --overwrite
      - name: Materialize Bronze evidence
        run: python -m analystops.ingestion.materialize --workers 4
      - name: Run 200-case production gate
        run: >-
          python -m analystops.agents.evaluate_bronze
          data/ingestion/corpus-results/corrupted
          --production-gate
          --output-dir outputs/evaluations
      - name: Retain evaluation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-production-evaluation-${{ github.run_id }}
          path: outputs/evaluations/*.json
          if-no-files-found: warn
          retention-days: 30
