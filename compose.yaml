services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analystops}
      POSTGRES_USER: ${POSTGRES_USER:-analystops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analystops_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - analystops-postgres:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 15

  metabase:
    image: metabase/metabase:v0.63.17.x
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_SITE_NAME: AnalystOps
      JAVA_TIMEZONE: ${METABASE_TIMEZONE:-America/New_York}
    ports:
      - "127.0.0.1:${METABASE_PORT:-3000}:3000"
    volumes:
      - analystops-metabase:/metabase-data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  analystops-postgres:
  analystops-metabase:
